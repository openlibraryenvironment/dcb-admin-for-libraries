variables:
  FF_USE_FASTZIP: "true"
  ARTIFACT_COMPRESSION_LEVEL: "fast"
  CACHE_COMPRESSION_LEVEL: "fast"
  # Must equal @playwright/test in package.json: the browsers are baked into the image.
  # verify_static fails if the two drift.
  PLAYWRIGHT_VERSION: "1.64.1"
  npm_config_cache: "$CI_PROJECT_DIR/.npm"
  # The runner's clone of gitlab.com has failed on a refused connection; retry it, not the job.
  GET_SOURCES_ATTEMPTS: "3"

  # Set to "true" when running a pipeline by hand: docs/testing.md, "The report on demand"
  ON_DEMAND_REPORT:
    value: "false"
    options: ["false", "true"]
    description: "true runs every check and the release report on the chosen branch or tag, and ships nothing."

default:
  # Node 24, as the Playwright image already is: npm 10 (node 22) refused a lock npm 11
  # wrote, failing `npm ci`. Floor: semantic-release 25 needs >=24.10.0. No bullseye build.
  image:
    name: node:24.21.0-bookworm
    pull_policy: if-not-present
  tags:
    - ki-onprem
  interruptible: true
  retry:
    max: 2
    when:
      - runner_system_failure
      - stuck_or_timeout_failure
      - scheduler_failure
      - api_failure
  # npm ci deletes node_modules, so only npm's download cache is worth keeping.
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - .npm/

stages:
  - verify
  - report
  - build
  - release
  - container
  - deploy

# One pipeline per event. A merge request is checked in its own pipeline, so a push to its
# branch does not start a second; main and release run on every push, as merges land there.
workflow:
  auto_cancel:
    on_new_commit: interruptible
  rules:
    # First, so a branch with an open merge request, or a tag, can be reported on by hand
    - if: $ON_DEMAND_REPORT == "true"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS && $CI_COMMIT_BRANCH !~ /^(main|release)$/
      when: never
    - if: $CI_COMMIT_BRANCH

# Which pipelines a job joins. Every job takes one of these, or rules of its own that say why.
.rules:
  # Every pipeline but a schedule: cheap enough to tell any push what it broke
  quick:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - when: on_success
  # The merge gate: a merge request, and main and release once a merge lands
  gate:
    - if: $ON_DEMAND_REPORT == "true"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_PIPELINE_SOURCE != "schedule" && $CI_COMMIT_BRANCH =~ /^(main|release)$/
  # The gate, but a merge request that changes nothing the app is built or tested from (only
  # docs, Markdown or unit tests) skips it. tests/ciChangePaths.test.ts keeps this list whole.
  app:
    - if: $ON_DEMAND_REPORT == "true"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        paths: &app_paths
          - src/**/*
          - e2e*/**/*
          - public/**/*
          - scripts/**/*
          - docker/**/*
          - "*.{json,ts,cjs,mjs,html,graphqls,yml,yaml,toml}"
          - ".*"
    - if: $CI_PIPELINE_SOURCE != "schedule" && $CI_COMMIT_BRANCH =~ /^(main|release)$/
  # A scheduled pipeline, set up in CI/CD > Schedules: docs/testing.md, "Nightly"
  nightly:
    - if: $CI_PIPELINE_SOURCE == "schedule"

# How each check ended, for the report job: an artifact, kept whether the check passed or not.
.records_status:
  after_script:
    - mkdir -p reports/status
    - |
      echo "{\"job\":\"$CI_JOB_NAME\",\"status\":\"$CI_JOB_STATUS\"}" > "reports/status/$CI_JOB_NAME.json"

verify_static:
  extends: .records_status
  stage: verify
  rules: !reference [.rules, quick]
  timeout: 15m
  script:
    - npm ci --prefer-offline --no-audit --no-fund
    - test "$(node -p "require('./package.json').devDependencies['@playwright/test']")" = "$PLAYWRIGHT_VERSION"
    - npx tsc --noEmit
    # eslint exits 0 on warnings; a warning here is broken code, not advice.
    - npm run lint -- --max-warnings=0
    # NOT `npm run test` - that script is bare `vitest`, which is watch mode.
    - npx vitest run --reporter=default --reporter=junit --outputFile.junit=reports/unit-junit.xml
  artifacts:
    when: always
    paths:
      - reports/
    reports:
      junit: reports/unit-junit.xml
    expire_in: 1 week

verify_dependencies:
  extends: .records_status
  stage: verify
  # Nightly too: an advisory can land against code nobody has changed
  rules:
    - !reference [.rules, gate]
    - !reference [.rules, nightly]
  timeout: 10m
  cache: []
  script:
    - npm audit --omit=dev --audit-level=high
    - node scripts/check-licences.mjs
  artifacts:
    when: always
    paths:
      - reports/
    expire_in: 1 week

# The build verify_e2e and verify_performance test, made once: in CI, with no .env and the base
# at the root, the three builds they made between them were identical.
verify_build:
  extends: .records_status
  stage: verify
  rules: !reference [.rules, app]
  timeout: 15m
  script:
    - npm ci --prefer-offline --no-audit --no-fund
    # BUNDLE_BUDGET ignores any .env, so `npm run budget:build` on a laptop measures this build
    - BUNDLE_BUDGET=1 VITE_PUBLIC_URL=/ npm run build
  artifacts:
    when: always
    paths:
      - dist/
      - reports/
    expire_in: 1 day

verify_e2e:
  extends: .records_status
  stage: verify
  rules: !reference [.rules, app]
  needs: [verify_build]
  variables:
    USE_EXISTING_BUILD: "1"
  timeout: 30m
  image:
    name: mcr.microsoft.com/playwright:v${PLAYWRIGHT_VERSION}-noble
    pull_policy: if-not-present
  script:
    - npm ci --prefer-offline --no-audit --no-fund
    # Includes e2e/accessibility.spec.ts, the WCAG 2.2 AA gate in light and dark.
    - npm run e2e
  artifacts:
    when: always
    expose_as: "E2E and accessibility report"
    paths:
      - playwright-report/
      - reports/
    reports:
      junit: reports/e2e-junit.xml
    expire_in: 1 week

verify_performance:
  extends: .records_status
  stage: verify
  rules: !reference [.rules, app]
  needs: [verify_build]
  variables:
    USE_EXISTING_BUILD: "1"
  timeout: 30m
  # lighthouserc.cjs points CHROME_PATH at the Chrome @playwright/test pins.
  image:
    name: mcr.microsoft.com/playwright:v${PLAYWRIGHT_VERSION}-noble
    pull_policy: if-not-present
  script:
    - npm ci --prefer-offline --no-audit --no-fund
    # Only the first load fails; the rest is reported.
    - npm run budget
    # Lighthouse can only reach /login; every other route is behind Keycloak.
    - npm run lighthouse
  artifacts:
    when: always
    expose_as: "Lighthouse report"
    paths:
      - .lighthouseci/
      - reports/
    expire_in: 1 week

# verify_e2e pins the base to "/", so this is the job that runs the shipped base.
verify_base_path:
  extends: .records_status
  stage: verify
  rules: !reference [.rules, app]
  timeout: 20m
  image:
    name: mcr.microsoft.com/playwright:v${PLAYWRIGHT_VERSION}-noble
    pull_policy: if-not-present
  script:
    - npm ci --prefer-offline --no-audit --no-fund
    - npm run e2e:base-path
  artifacts:
    when: always
    expose_as: "Base-path report"
    paths:
      - playwright-report/
      - reports/
    reports:
      junit: reports/base-path-junit.xml
    expire_in: 1 week

verify_ki_bootstrap:
  extends: .records_status
  stage: verify
  rules: !reference [.rules, app]
  timeout: 20m
  image:
    name: mcr.microsoft.com/playwright:v${PLAYWRIGHT_VERSION}-noble
    pull_policy: if-not-present
  script:
    - npm ci --prefer-offline --no-audit --no-fund
    - npm run e2e:ki-bootstrap
  artifacts:
    when: always
    expose_as: "Bootloader report"
    paths:
      - playwright-report/
      - reports/
    reports:
      junit: reports/ki-bootstrap-junit.xml
    expire_in: 1 week

# Every secret ever committed stays readable in history; only rotation un-leaks it.
verify_secrets:
  extends: .records_status
  stage: verify
  rules: !reference [.rules, quick]
  timeout: 10m
  cache: []
  image:
    name: zricethezav/gitleaks:v8.30.1
    entrypoint: [""]
  variables:
    # The default 20-commit clone would scan a sliding window and report clean.
    GIT_DEPTH: "0"
  script:
    # --redact so a finding does not print the secret into a widely readable job log.
    - gitleaks git --redact --exit-code 1 --config .gitleaks.toml --report-format sarif --report-path gitleaks.sarif .
  artifacts:
    when: always
    paths:
      - gitleaks.sarif
      - reports/
    expire_in: 1 month

# Nothing else here builds the image: on node 22 it stopped at `npm ci` while every job passed.
# In the verify stage, so a release branch whose image cannot build does not release.
verify_image:
  extends: .records_status
  stage: verify
  timeout: 20m
  cache: []
  # Always before a release; otherwise only when the image's own files change. A merge
  # request's `changes` are compared with its target branch.
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - if: '$CI_COMMIT_BRANCH == "release" || $ON_DEMAND_REPORT == "true"'
    - if: '$CI_COMMIT_BRANCH == "main" || $CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        paths:
          - docker/**/*
          - .dockerignore
          - package.json
          - package-lock.json
  image:
    name: docker:27
    pull_policy: if-not-present
  services:
    - name: docker:27-dind
      alias: docker
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
  script:
    # dind can still be starting; without this the first symptom is a build error about the daemon.
    - |
      for attempt in $(seq 1 30); do
        docker info >/dev/null 2>&1 && break
        sleep 2
      done
      docker info >/dev/null || { echo "No Docker daemon at $DOCKER_HOST: this job needs a runner that permits privileged containers."; exit 1; }
    - docker build -f docker/production/Dockerfile -t "dcb-admin-for-libraries:$CI_COMMIT_SHORT_SHA" .
  artifacts:
    when: always
    paths:
      - reports/
    expire_in: 1 week

# The browser tests several times over with no retries, so a test that passes only sometimes
# fails here, where CI's `retries: 2` would have retried it into a pass.
nightly_flake_hunt:
  stage: verify
  rules: !reference [.rules, nightly]
  timeout: 3h
  image:
    name: mcr.microsoft.com/playwright:v${PLAYWRIGHT_VERSION}-noble
    pull_policy: if-not-present
  variables:
    FLAKE_REPEAT: "3"
  script:
    - npm ci --prefer-offline --no-audit --no-fund
    - npx playwright test --repeat-each="$FLAKE_REPEAT" --retries=0
  artifacts:
    when: always
    expose_as: "Flake hunt report"
    paths:
      - playwright-report/
    reports:
      junit: reports/e2e-junit.xml
    expire_in: 2 weeks

# Every check's result in plain language, for people who do not read code: docs/testing.md,
# "The release report". `when: always`, so a failed pipeline is explained too.
report:
  stage: report
  timeout: 10m
  cache: []
  # Release, which attaches it, and a pipeline run on demand: both run every check below
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - if: $CI_COMMIT_BRANCH == "release" || $ON_DEMAND_REPORT == "true"
      when: always
  needs:
    - verify_static
    - verify_secrets
    - verify_dependencies
    - verify_build
    - verify_e2e
    - verify_performance
    - verify_base_path
    - verify_ki_bootstrap
    - verify_image
  script:
    - node scripts/release-report.ts
  artifacts:
    when: always
    expose_as: "Release report"
    paths:
      - reports/release-report.html
    expire_in: 1 month

build:
  stage: build
  rules: !reference [.rules, app]
  timeout: 15m
  script:
    - npm ci --prefer-offline --no-audit --no-fund
    # Must equal the S3 app prefix the worker serves this app from.
    - VITE_PUBLIC_URL=/dcb-admin-for-libraries/ npm run build
    # The committed route tree is what tsc checked; a build that regenerates it differently means it was stale.
    - git diff --exit-code -- src/routeTree.gen.ts
    - grep -qF 'src="/dcb-admin-for-libraries/assets/' dist/index.html
    - grep -qF "<meta name=\"dcb-admin-for-libraries-build\" content=\"$CI_COMMIT_SHORT_SHA\">" dist/index.html
    # The worker's CSP must allow these; see docs/DEPLOYMENT.md, "Releasing to the kihosting hosts".
    - node scripts/print-csp-hashes.mjs
  artifacts:
    paths:
      - dist/
    # Long enough to retry a failed deploy the next day.
    expire_in: 1 week

release:
  stage: release
  interruptible: false
  timeout: 15m
  # No `needs`: it would let this start before the verify stage has passed.
  rules:
    - if: '$CI_COMMIT_BRANCH == "release" && $CI_PIPELINE_SOURCE != "schedule" && $ON_DEMAND_REPORT != "true"'
      when: on_success
    - when: never
  # The report, which .releaserc.json attaches to the GitLab Release
  dependencies: [report]
  script:
    - echo " { \"releaseDate\":\"`date +"%Y-%m-%dT%H:%M:%S%z"`\", \"RELEASED_AT\":\"$RELEASED_AT\" } " > ./release-info.json
    - npm ci --prefer-offline --no-audit --no-fund
    - npm run semantic-release
    - export RELEASE_VERSION="v$(node -p "require('./package.json').version")"
    # Only true if @semantic-release/npm wrote the version before @semantic-release/git committed it.
    - test "$RELEASE_VERSION" = "$(git describe --tags --abbrev=0)"
    - echo "RELEASE_VERSION=$RELEASE_VERSION" > deploy.env
  artifacts:
    reports:
      dotenv: deploy.env

# The production image, pushed to K-Int's Harbor beside DCB Admin's: main -> :main-<sha> and :next,
# a release -> :<version> and :latest. The first of each pair is immutable. docs/DEPLOYMENT.md, "Images".
.publish_image:
  stage: container
  interruptible: false
  timeout: 30m
  # No npm cache: restored, it sits in the build context and is copied into the build stage.
  cache: []
  image:
    name: moby/buildkit:v0.33.1-rootless
    entrypoint: [""]
    pull_policy: if-not-present
  variables:
    # Rootless buildkit in an unprivileged runner cannot use the default process sandbox.
    BUILDKITD_FLAGS: --oci-worker-no-process-sandbox
    CONTAINER_REGISTRY: harbor.k-int.com
    CONTAINER_IMAGE: harbor.k-int.com/knowledgeintegration/dcb-admin-for-libraries
  before_script:
    # Inherited protected group variables, so only a protected branch (main, release) has them
    - test -n "$HARBOR_USERNAME" && test -n "$HARBOR_PASSWORD"
    - mkdir -p ~/.docker
    # A docker config rather than a flag, so the password never appears in a process list.
    - |
      AUTH="$(printf '%s' "$HARBOR_USERNAME:$HARBOR_PASSWORD" | base64 | tr -d '\n')"
      printf '{"auths":{"%s":{"auth":"%s"}}}' "$CONTAINER_REGISTRY" "$AUTH" > ~/.docker/config.json
  script:
    - echo "publishing ${CONTAINER_IMAGE}:${PRIMARY} (and :${MOVING})"
    - buildctl-daemonless.sh build
      --frontend dockerfile.v0
      --local context=.
      --local dockerfile=docker/production
      --output "type=image,\"name=${CONTAINER_IMAGE}:${PRIMARY},${CONTAINER_IMAGE}:${MOVING}\",push=true"

publish_image_next:
  extends: .publish_image
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" && $CI_COMMIT_TAG == null && $CI_PIPELINE_SOURCE != "schedule" && $ON_DEMAND_REPORT != "true"'
      when: on_success
    - when: never
  variables:
    PRIMARY: main-$CI_COMMIT_SHORT_SHA
    MOVING: next

publish_image_release:
  extends: .publish_image
  rules:
    - if: '$CI_COMMIT_BRANCH == "release" && $CI_PIPELINE_SOURCE != "schedule" && $ON_DEMAND_REPORT != "true"'
      when: on_success
    - when: never
  # No `dependencies`: $RELEASE_VERSION arrives as the release job's dotenv report.
  needs:
    - release
  script:
    - test -n "$RELEASE_VERSION"
    - export PRIMARY="${RELEASE_VERSION#v}" MOVING=latest
    # The version Preferences shows, read at runtime, as the deploy jobs write it beside the bundle.
    - echo "{\"version\":\"${RELEASE_VERSION}\"}" > public/release.json
    - !reference [.publish_image, script]

# Copy the dist build up to S3, where the Cloudflare worker serves it by hostname.
deploy_tag_to_s3:
  stage: deploy
  interruptible: false
  timeout: 15m
  cache: []
  rules:
    - if: '$CI_COMMIT_BRANCH == "release" && $CI_PIPELINE_SOURCE != "schedule" && $ON_DEMAND_REPORT != "true"'
      when: on_success
    - when: never
  image:
    name: registry.gitlab.com/gitlab-org/cloud-deploy/aws-base:latest
    pull_policy: if-not-present
  variables:
    AWS_ACCESS_KEY_ID: $AWS_DEVOPS_AGENT_ACCESS_KEY_ID
    AWS_SECRET_ACCESS_KEY: $AWS_DEVOPS_AGENT_ACCESS_KEY_SECRET
    AWS_REGION: eu-west-1
    # Trailing slash is load-bearing: --delete one level up would wipe the sibling apps.
    DEST: "s3://ki-libs-spa-hosting/prod/dcb-admin-for-libraries/"
  # Both in `needs` and no `dependencies`: a `dependencies` list would stop release's dotenv arriving.
  needs:
    - build
    - release
  script:
    - test -n "$RELEASE_VERSION"
    # The app's version, read at runtime: the build ran before semantic-release chose it.
    # docs/release-highlights.md
    - echo "{\"version\":\"${RELEASE_VERSION}\"}" > dist/release.json
    # Hashed assets, then stable names, then the shell: nothing goes live before the chunks it names.
    # Same three passes as dcb-admin-ui; the reasoning is in its docs/deployment.md.
    - aws s3 sync dist/ "$DEST" --delete --exclude "*" --include "assets/*"
      --cache-control "public, max-age=31536000, immutable"
    - aws s3 sync dist/ "$DEST" --delete --exclude "assets/*" --exclude "index.html" --exclude "inject_env.json"
      --cache-control "public, no-cache"
    - aws s3 cp dist/index.html "${DEST}index.html"
      --cache-control "no-store, no-cache, must-revalidate"
    # Roll-back copy, never served in place: the base is baked in.
    - aws s3 sync dist/ "s3://ki-libs-spa-hosting/archive/dcb-admin-for-libraries-$RELEASE_VERSION/" --delete

# Runs on the release BRANCH: semantic-release's "[skip ci]" release commit also skips
# the tag pipeline, so the tag-gated job this replaces never ran.
deploy_release_to_r2:
  stage: deploy
  interruptible: false
  timeout: 15m
  cache: []
  rules:
    - if: '$CI_COMMIT_BRANCH == "release" && $CI_PIPELINE_SOURCE != "schedule" && $ON_DEMAND_REPORT != "true"'
      when: on_success
    - when: never
  image:
    name: registry.gitlab.com/gitlab-org/cloud-deploy/aws-base:latest
    pull_policy: if-not-present
  variables:
    AWS_ACCESS_KEY_ID: $CF_ACCESS_KEY_ID
    AWS_SECRET_ACCESS_KEY: $CF_SECRET_ACCESS_KEY
    AWS_REGION: auto
  needs:
    - build
    - release
  script:
    - test -n "$RELEASE_VERSION"
    - echo "Publishing $RELEASE_VERSION to CF R2..."
    # Beside the bundle, as on S3; under the bootloader the app reads the version from its path too.
    - echo "{\"version\":\"${RELEASE_VERSION}\"}" > dist/release.json
    # A published version directory is immutable; refuse to overwrite one.
    - test -z "$(aws s3 ls "s3://ki-front-end-bundles/dcb-admin-for-libraries/${RELEASE_VERSION}/" --endpoint-url "https://${CF_ACCOUNT_ID}.r2.cloudflarestorage.com" --recursive)"
    - aws s3 cp dist/ "s3://ki-front-end-bundles/dcb-admin-for-libraries/${RELEASE_VERSION}/" --endpoint-url "https://${CF_ACCOUNT_ID}.r2.cloudflarestorage.com" --recursive
    # The channel file the bootloader reads for "latest", written after the bundle it names.
    - echo "{\"version\":\"${RELEASE_VERSION}\"}" > latest.json
    - aws s3 cp latest.json "s3://ki-front-end-bundles/dcb-admin-for-libraries/latest.json" --endpoint-url "https://${CF_ACCOUNT_ID}.r2.cloudflarestorage.com"

deploy_dev_to_s3:
  stage: deploy
  interruptible: false
  timeout: 15m
  cache: []
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" && $CI_COMMIT_TAG == null && $CI_PIPELINE_SOURCE != "schedule" && $ON_DEMAND_REPORT != "true"'
      when: on_success
    - when: never
  image:
    name: registry.gitlab.com/gitlab-org/cloud-deploy/aws-base:latest
    pull_policy: if-not-present
  variables:
    AWS_ACCESS_KEY_ID: $AWS_DEVOPS_AGENT_ACCESS_KEY_ID
    AWS_SECRET_ACCESS_KEY: $AWS_DEVOPS_AGENT_ACCESS_KEY_SECRET
    AWS_REGION: eu-west-1
    # dev.kihosting.net's env root is "dev"; a key prefix the worker does not know is a 502.
    DEST: "s3://ki-libs-spa-hosting/dev/dcb-admin-for-libraries/"
  needs:
    - build
  script:
    - aws s3 sync dist/ "$DEST" --delete --exclude "*" --include "assets/*"
      --cache-control "public, max-age=31536000, immutable"
    - aws s3 sync dist/ "$DEST" --delete --exclude "assets/*" --exclude "index.html" --exclude "inject_env.json"
      --cache-control "public, no-cache"
    - aws s3 cp dist/index.html "${DEST}index.html"
      --cache-control "no-store, no-cache, must-revalidate"

deploy_dev_to_r2:
  stage: deploy
  interruptible: false
  timeout: 15m
  cache: []
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" && $CI_COMMIT_TAG == null && $CI_PIPELINE_SOURCE != "schedule" && $ON_DEMAND_REPORT != "true"'
      when: on_success
    - when: never
  image:
    name: registry.gitlab.com/gitlab-org/cloud-deploy/aws-base:latest
    pull_policy: if-not-present
  variables:
    AWS_ACCESS_KEY_ID: $CF_ACCESS_KEY_ID
    AWS_SECRET_ACCESS_KEY: $CF_SECRET_ACCESS_KEY
    AWS_REGION: auto
  needs:
    - build
  script:
    - aws s3 rm "s3://ki-front-end-bundles/dcb-admin-for-libraries/next/" --endpoint-url "https://${CF_ACCOUNT_ID}.r2.cloudflarestorage.com" --recursive || true
    - aws s3 cp dist/ "s3://ki-front-end-bundles/dcb-admin-for-libraries/next/" --endpoint-url "https://${CF_ACCOUNT_ID}.r2.cloudflarestorage.com" --recursive
